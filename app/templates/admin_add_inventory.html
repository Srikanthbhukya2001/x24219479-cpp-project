{% extends 'admin_sidebar.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Inventory</title>
    <style>
        .form-hero{
            width:100%;
            padding:44px 48px;
            background:
                linear-gradient(120deg, rgba(11,37,69,0.90), rgba(244,169,58,0.4)),
                url('https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?auto=format&fit=crop&w=1600&q=75') center/cover no-repeat;
            color:#fff;
        }
        .form-hero h1{font-size:32px; margin:0 0 6px 0; letter-spacing:-0.02em;}
        .form-hero p{margin:0; color:rgba(255,255,255,0.85); font-size:14.5px;}

        .form-page{
            width:100%;
            padding:44px 48px 60px 48px;
            background:#F6F8FB;
            min-height:100vh;
            display:flex;
            justify-content:center;
        }

        .form-card{
            width:100%;
            max-width:600px;
            background:#fff;
            border-radius:16px;
            box-shadow:0 8px 24px rgba(11,37,69,0.08);
            border:1px solid #E3EAF1;
            padding:36px 38px;
        }

        .field-group{margin-bottom:22px;}
        .field-group label{
            font-weight:600;
            display:block;
            margin-bottom:8px;
            font-size:13.5px;
            color:#0B2545;
            text-transform:uppercase;
            letter-spacing:0.04em;
        }
        .field-group input, .field-group select{
            width: 100%;
            padding: 12px 14px;
            border-radius: 9px;
            border: 1.5px solid #E3EAF1;
            font-size: 15px;
            font-family:'Inter',sans-serif;
            background:#F9FBFD;
        }
        .field-group input[readonly]{color:#5A7080; background:#F0F3F7;}
        .field-group input:focus, .field-group select:focus{outline:none; border-color:#17BEBB; background:#fff;}

        #stock-info{
            font-weight: 600;
            color: #0e8f8d;
            background:#E8FBFA;
            border:1px solid #C7F1EF;
            padding:10px 14px;
            border-radius:8px;
            margin-bottom: 20px;
            font-family:'IBM Plex Mono',monospace;
            font-size:13.5px;
            min-height:14px;
        }

        .btn-submit{
            width:100%;
            padding: 14px;
            background: linear-gradient(135deg,#F4A93A,#DC8E1D);
            color: #0B2545;
            font-size: 15.5px;
            border: none;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
            box-shadow:0 8px 18px rgba(244,169,58,0.32);
        }
    </style>
</head>
<body>
    <div class="form-hero">
        <h1>Add Inventory</h1>
        <p>Stock a size and quantity for {{ product.name }}.</p>
    </div>

    <div class="form-page">
        <div class="form-card">
            <form method="POST">
                {% csrf_token %}

                <div class="field-group">
                    <label for="product">Product</label>
                    <input type="text" name="product" id="product"
                           value="{{ product.name }}" readonly>
                </div>

                <div class="field-group">
                    <label for="description">Description</label>
                    <input type="text" name="description" id="description"
                           value="{{ product.description }}" readonly>
                </div>

                <div class="field-group">
                    <label for="size">Select Size</label>
                    <select name="size" id="size" required>
                        <option value="">-- Select Size --</option>
                        {% for size in sizes %}
                            <option value="{{ size.size }}">{{ size }}</option>
                        {% endfor %}
                    </select>
                </div>

                <p id="stock-info"></p>

                <div class="field-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" name="quantity" id="quantity"
                           min="1" required>
                </div>

                <input type="hidden" name="product_id" value="{{ product.id }}">

                <button type="submit" class="btn-submit">
                    Submit Inventory
                </button>
            </form>
        </div>
    </div>
</body>
</html>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const sizeSelect  = document.getElementById('size');
    const stockInfo   = document.getElementById('stock-info');
    const productId   = "{{ product.id }}";   // comes from the template context

    sizeSelect.addEventListener('change', function () {
        const size = this.value;

        if (size) {
            fetch(`/get-stock/${productId}/${size}/`)
                .then(response => response.json())
                .then(data => {
                    stockInfo.textContent = `Available Stock: ${data.stock}`;
                })
                .catch(() => {
                    stockInfo.textContent = 'Error loading stock.';
                });
        } else {
            stockInfo.textContent = '';
        }
    });
});
</script>
{% endblock %}
