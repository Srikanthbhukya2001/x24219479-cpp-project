{% load static %}

<!DOCTYPE html>
<html
  lang="en"
  class="light-style customizer-hide"
  dir="ltr"
  data-theme="theme-default"
  data-assets-path="{% static 'assets/' %}"
  data-template="vertical-menu-template-free"
>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />

    <title>Inventory</title>

    <meta name="description" content="" />

    <link rel="icon" type="image/x-icon" href="{% static 'assets/img/favicon/favicon.ico' %}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'assets/vendor/fonts/boxicons.css' %}" />

    <link rel="stylesheet" href="{% static 'assets/vendor/css/core.css' %}" class="template-customizer-core-css" />
    <link rel="stylesheet" href="{% static 'assets/vendor/css/theme-default.css' %}" class="template-customizer-theme-css" />
    <link rel="stylesheet" href="{% static 'assets/css/demo.css' %}" />

    <link rel="stylesheet" href="{% static 'assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css' %}" />
    <script src="{% static 'assets/vendor/js/helpers.js' %}"></script>
    <script src="{% static 'assets/js/config.js' %}"></script>
  </head>

  <style>
    @charset "UTF-8";
    *{box-sizing:border-box;}
    html,body{height:100%; margin:0;}
    body{font-family:'Inter',sans-serif;}

    .authentication-wrapper {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    .auth-visual{
        flex:1.15;
        position:relative;
        background:
            linear-gradient(160deg, rgba(11,37,69,0.88), rgba(23,190,187,0.55)),
            url('https://images.unsplash.com/photo-1558769132-cb1aea458c5e?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
        display:flex;
        flex-direction:column;
        justify-content:space-between;
        padding:56px;
        color:#fff;
    }
    .auth-visual .brand{
        display:flex; align-items:center; gap:10px;
        font-family:'Space Grotesk',sans-serif;
        font-size:24px; font-weight:700;
    }
    .auth-visual .brand i{color:#F4A93A; font-size:26px;}
    .auth-visual .pitch h2{
        font-family:'Space Grotesk',sans-serif;
        font-size:34px;
        max-width:460px;
        line-height:1.25;
        margin:0 0 14px 0;
    }
    .auth-visual .pitch p{
        max-width:420px;
        color:rgba(255,255,255,0.85);
        font-size:15px;
        line-height:1.6;
    }
    .auth-visual .tagline{
        font-family:'IBM Plex Mono',monospace;
        font-size:12.5px;
        letter-spacing:0.1em;
        text-transform:uppercase;
        color:rgba(255,255,255,0.65);
    }

    .authentication-inner{
        flex:1;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#F6F8FB;
        padding:40px;
    }

    .auth-card{
        width:100%;
        max-width:420px;
        background:#ffffff;
        border-radius:18px;
        box-shadow:0 12px 32px rgba(11,37,69,0.10);
        border:1px solid #E3EAF1;
        padding:40px 38px;
    }

    @media (max-width: 900px){
        .auth-visual{display:none;}
    }

  </style>

  <body>

    <div class="authentication-wrapper">

        <div class="auth-visual">
            <div class="brand"><i class='bx bxs-purchase-tag'></i> Inventory</div>
            <div class="pitch">
                <h2>Run your clothing inventory like a pro.</h2>
                <p>Track stock, manage sales, and keep every product organized from one dashboard.</p>
            </div>
            <div class="tagline">Inventory &middot; Sales &middot; Analytics</div>
        </div>

        <div class="authentication-inner">
            <div class="auth-card">
              {% block content %}

              {% endblock %}
            </div>
        </div>

    </div>


    <script src="{% static 'assets/vendor/libs/jquery/jquery.js' %}"></script>
    <script src="{% static 'assets/vendor/libs/popper/popper.js' %}"></script>
    <script src="{% static 'assets/vendor/js/bootstrap.js' %}"></script>
    <script src="{% static 'assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js' %}"></script>

    <script src="{% static 'assets/vendor/js/menu.js' %}"></script>

    <script src="{% static 'assets/js/main.js' %}"></script>

    <script async defer src="https://buttons.github.io/buttons.js"></script>
  </body>
</html>
